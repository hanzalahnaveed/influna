name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/creator, feat/creator-marketplace-foundation]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/influna?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh lockfile for patched dependencies
        run: npm install --package-lock-only
      - name: Install dependencies
        run: npm ci
      - name: Test campaign workflow state machine
        run: npm run test:workflow
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Generate Prisma client
        run: npm run db:generate
      - name: Build Next.js application
        run: npm run build
